name: Fork Release

# Personal fork builds. Versions use the nightly scheme so installs follow this
# repository's prereleases through the nightly update channel.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

# T3 Connect against the fork's self-hosted relay (infra/relay) and Clerk app.
# scripts/lib/public-config.ts reads these from the process environment, so
# every build step embeds them; they are public client identifiers.
env:
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
  T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
  T3CODE_HOSTED_APP_URL: ${{ vars.T3CODE_HOSTED_APP_URL }}
  VITE_HOSTED_APP_URL: ${{ vars.T3CODE_HOSTED_APP_URL }}
  T3CODE_MOBILE_OTLP_TRACES_URL: ${{ vars.T3CODE_MOBILE_OTLP_TRACES_URL }}
  T3CODE_MOBILE_OTLP_TRACES_DATASET: ${{ vars.T3CODE_MOBILE_OTLP_TRACES_DATASET }}
  T3CODE_MOBILE_OTLP_TRACES_TOKEN: ${{ secrets.T3CODE_MOBILE_OTLP_TRACES_TOKEN }}
  T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ${{ vars.T3CODE_RELAY_CLIENT_OTLP_TRACES_URL }}
  T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ${{ vars.T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET }}
  T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ${{ secrets.T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN }}

jobs:
  meta:
    name: Resolve version
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      # Same scheme as scripts/resolve-nightly-release.ts, inlined so this job
      # needs no dependency install: next patch + -nightly.<date>.<run>.
      - id: meta
        run: |
          version="$(node -p '
            const [maj, min, pat] = require("./apps/desktop/package.json").version.replace(/[-+].*$/, "").split(".").map(Number);
            `${maj}.${min}.${pat + 1}`')-nightly.$(date -u +%Y%m%d).${{ github.run_number }}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "name=T3 Code Nightly $version (${GITHUB_SHA::12})"
          } | tee -a "$GITHUB_OUTPUT"

  mac:
    name: macOS arm64
    needs: meta
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.FORK_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.FORK_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # electron-builder only lists valid identities, so trust the
          # self-signed certificate for code signing on this runner.
          security find-certificate -c "T3 Code Fork" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning | grep -q 'T3 Code Fork'
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      - name: Build
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_FORK_MAC_SIGN_IDENTITY: T3 Code Fork
        run: |
          vp run dist:desktop:artifact \
            --platform mac --target dmg --arch arm64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --signed --verbose

      - name: Verify signature
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 3 -name '*.app' -type d | head -1)"
          if [[ -z "$app" ]]; then
            hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" release/*.dmg
            app="$(find "$RUNNER_TEMP/dmg" -maxdepth 1 -name '*.app' | head -1)"
          fi
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|Identifier|Timestamp'

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Build
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux --target AppImage --arch x64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*-linux.yml
          if-no-files-found: error

  # Hosted web client for the Dokploy deployment at t3.prasetya.dev.
  web-image:
    name: Web image
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            T3CODE_VERSION=${{ needs.meta.outputs.version }}
            T3CODE_CLERK_PUBLISHABLE_KEY=${{ env.T3CODE_CLERK_PUBLISHABLE_KEY }}
            T3CODE_CLERK_JWT_TEMPLATE=${{ env.T3CODE_CLERK_JWT_TEMPLATE }}
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=${{ env.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
            T3CODE_RELAY_URL=${{ env.T3CODE_RELAY_URL }}
            T3CODE_HOSTED_APP_URL=${{ env.T3CODE_HOSTED_APP_URL }}
            T3CODE_RELAY_CLIENT_OTLP_TRACES_URL=${{ env.T3CODE_RELAY_CLIENT_OTLP_TRACES_URL }}
            T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET=${{ env.T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET }}
          # Ingest-only, but kept out of image history.
          secrets: |
            relay_client_otlp_token=${{ secrets.T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}-web:nightly
            ghcr.io/${{ github.repository }}-web:${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Sideloaded Android client. The development package installs next to the
  # store app, matching the fork's Firebase app and Clerk SSO allowlist.
  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: development
      MOBILE_VERSION_POLICY: appVersion
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      # Nightly run number keeps versionCode increasing across releases.
      T3CODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
      T3CODE_ANDROID_KEY_ALIAS: ${{ secrets.FORK_ANDROID_KEY_ALIAS }}
      T3CODE_ANDROID_KEY_PASSWORD: ${{ secrets.FORK_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # ubuntu-24.04 ships the Android SDK at $ANDROID_HOME; Gradle installs the
      # platform, build-tools, and NDK versions the project pins on first use.
      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.FORK_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 T3CODE_ANDROID_KEYSTORE_PASSWORD T3CODE_ANDROID_KEY_ALIAS T3CODE_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing secret for $name" >&2; exit 1; fi
          done
          keystore="$RUNNER_TEMP/fork-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "T3CODE_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            services="$RUNNER_TEMP/google-services.json"
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$services"
            echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$services" >> "$GITHUB_ENV"
          fi

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      - name: Build signed APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mkdir -p release
          cp "$apk" "release/T3-Code-${{ needs.meta.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [meta, mac, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          # Upstream reuses the nightly tag scheme, so ask this repository for
          # its own last release instead of reading tags.
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$prev" ]]; then git fetch --quiet origin "refs/tags/$prev:refs/tags/$prev"; fi
          .github/scripts/fork-release-notes.sh "$GITHUB_SHA" upstream/main "$prev" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Only the installers; the image job also uploads a .dockerbuild record.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          gh release create "${{ needs.meta.outputs.tag }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.meta.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease
