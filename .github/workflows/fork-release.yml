name: Fork Release

# Personal fork builds. Versions use the nightly scheme so installs follow this
# repository's prereleases through the nightly update channel.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      # Same scheme as scripts/resolve-nightly-release.ts, inlined so this job
      # needs no dependency install: next patch + -nightly.<date>.<run>.
      - id: meta
        run: |
          version="$(node -p '
            const [maj, min, pat] = require("./apps/desktop/package.json").version.replace(/[-+].*$/, "").split(".").map(Number);
            `${maj}.${min}.${pat + 1}`')-nightly.$(date -u +%Y%m%d).${{ github.run_number }}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "name=T3 Code Nightly $version (${GITHUB_SHA::12})"
          } | tee -a "$GITHUB_OUTPUT"

  mac:
    name: macOS arm64
    needs: meta
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      # Public T3 Connect identifiers, the same ones official builds embed.
      - name: Enable T3 Connect config
        run: cp .env.example .env

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.FORK_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.FORK_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # electron-builder only lists valid identities, so trust the
          # self-signed certificate for code signing on this runner.
          security find-certificate -c "T3 Code Fork" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning | grep -q 'T3 Code Fork'
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      - name: Build
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_FORK_MAC_SIGN_IDENTITY: T3 Code Fork
        run: |
          vp run dist:desktop:artifact \
            --platform mac --target dmg --arch arm64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --signed --verbose

      - name: Verify signature
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 3 -name '*.app' -type d | head -1)"
          if [[ -z "$app" ]]; then
            hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" release/*.dmg
            app="$(find "$RUNNER_TEMP/dmg" -maxdepth 1 -name '*.app' | head -1)"
          fi
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|Identifier|Timestamp'

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Enable T3 Connect config
        run: cp .env.example .env

      - name: Build
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux --target AppImage --arch x64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*-linux.yml
          if-no-files-found: error

  # Headless server image for the Dokploy deployment at t3.prasetya.dev.
  server-image:
    name: Server image
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Enable T3 Connect config
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: T3CODE_VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [meta, mac, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          gh release create "${{ needs.meta.outputs.tag }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.meta.outputs.name }}" \
            --notes "Fork build of $GITHUB_SHA." \
            --prerelease
